<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>所要時間編集ページ</title>
  <style>
    body { font-family:sans-serif; background-color:#111; color:#eee; padding:1em; margin:0; }
    h1 { color:#ff6666; font-size:1.5em; margin:0 0 .55em; }
    h2 { font-size:1.1em; margin:.45em 0; }
    #timer-panel { margin-bottom:12px !important; }
    table { width:100%; border-collapse:collapse; margin-top:.7em; }
    th,td { padding:.35em; border:1px solid #555; text-align:center; }
    th { background:#222; font-size:.9em; }
    input[type=number] { width:52px; padding:.25em; background:#222; color:#fff; border:1px solid #444; }
    button { padding:.38em .85em; background:crimson; color:white; border:none; border-radius:4px; cursor:pointer; }
    button:hover { background:darkred; }
    #message { margin-top:.55em; font-size:.9em; color:lightgreen; min-height:1.2em; }
    #next-estimate { margin-top:.45em; font-size:.95em; color:lightblue; }
    #current-ticket { font-size:1em !important; margin-bottom:.35em !important; }
    #elapsed-time { font-size:1.3em !important; margin-bottom:.35em !important; }
    .timer-buttons button { margin:.15em; }
    @media (max-width:600px) {
      body { padding:.65em .5em; }
      h1 { font-size:1.25em; }
      h2 { font-size:1em; }
      th,td { padding:.28em .15em; font-size:.8em; }
      input[type=number] { width:45px; }
      button { font-size:.82em; padding:.34em .65em; }
    }
  </style>
</head>
<body>
  <h1>整理券ごとの所要時間</h1>
  <div id="timer-panel">
    <h2>呼び出し番号の時間計測</h2>
    <div id="current-ticket">現在計測中: -</div>
    <div id="elapsed-time" style="color:gold;">00:00</div>
    <div class="timer-buttons">
      <button onclick="startMeasurement()">開始</button>
      <button onclick="finishMeasurement()">完了</button>
    </div>
  </div>
  <div id="message"></div>
  <div id="next-estimate"></div>
  <table id="time-table">
    <thead><tr><th>整理券番号</th><th>所要時間（分）</th><th>手動編集</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
let timerInterval = null;
let timerStartTime = null;
let measuringTicket = null;
const DEFAULT_TICKET_MINUTES = 6;

async function loadTimeData() {
  try {
    const res = await fetch("/api/time-data");
    const data = await res.json();
    const tbody = document.querySelector("#time-table tbody");
    tbody.innerHTML = "";

    data.sort((a,b) => a.number - b.number).forEach(entry => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${entry.number}</td>
        <td><input type="number" id="time-${entry.number}" value="${typeof entry.actualMinutes === "number" ? entry.actualMinutes : DEFAULT_TICKET_MINUTES}" min="0" /></td>
        <td><button onclick="updateTime(${entry.number})">更新</button></td>
      `;
      tbody.appendChild(tr);
    });

    const settingsRes = await fetch("/api/ticket-settings");
    const settings = await settingsRes.json();
    const [sh,sm] = (settings.start || "09:30").split(":").map(Number);
    const start = new Date();
    start.setHours(sh,sm,0,0);
    let total = 0;
    data.forEach(entry => {
      total += typeof entry?.actualMinutes === "number" ? entry.actualMinutes : DEFAULT_TICKET_MINUTES;
    });
    const estimate = new Date(start.getTime() + total * 60000);
    const h = estimate.getHours().toString().padStart(2,"0");
    const m = estimate.getMinutes().toString().padStart(2,"0");
    document.getElementById("next-estimate").textContent =
      `次の整理券（${data.length + 1}番）の目安 ${h}:${m} 頃`;
  } catch(e) {
    document.getElementById("message").textContent = "データの読み込みに失敗しました。";
  }
}

async function updateTime(number) {
  const minutes = parseInt(document.getElementById(`time-${number}`).value);
  if (isNaN(minutes) || minutes < 0) { alert("正しい所要時間を入力してください。"); return; }
  try {
    const res = await fetch("/api/time-data", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({number,actualMinutes:minutes})
    });
    const data = await res.json();
    document.getElementById("message").textContent = data.message || "更新しました。";
    loadTimeData();
  } catch(e) { document.getElementById("message").textContent = "更新に失敗しました。"; }
}

async function getCurrentNumber() {
  const res = await fetch("/api/number");
  const data = await res.json();
  return data.number;
}

function runTimer() {
  clearInterval(timerInterval);
  timerStartTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - timerStartTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    document.getElementById("elapsed-time").textContent =
      `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  },1000);
}

async function startMeasurement() {
  if (timerInterval) { alert("すでに計測中です"); return; }
  const currentNumber = await getCurrentNumber();
  if (!currentNumber || currentNumber <= 0) { alert("呼び出し番号が0になっています"); return; }
  measuringTicket = currentNumber;
  document.getElementById("current-ticket").textContent = `現在計測中: ${measuringTicket}番`;
  runTimer();
  document.getElementById("message").textContent = `${measuringTicket}番の計測を開始しました`;
}

async function finishMeasurement() {
  if (!timerInterval || !measuringTicket) { alert("計測されていません"); return; }

  clearInterval(timerInterval);
  timerInterval = null;
  const finishedTicket = measuringTicket;
  const elapsedMinutes = Math.max(1, Math.round((Date.now() - timerStartTime) / 60000));

  try {
    const saveRes = await fetch("/api/time-data", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({number:finishedTicket,actualMinutes:elapsedMinutes})
    });
    if (!saveRes.ok) throw new Error("保存失敗");

    // 完了したら自動で呼び出し番号を+1し、その番号の計測を開始。
    const callRes = await fetch("/api/call", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({diff:1})
    });
    if (!callRes.ok) throw new Error("番号変更失敗");
    const callData = await callRes.json();
    const nextNumber = await getCurrentNumber();

    measuringTicket = nextNumber;
    timerStartTime = Date.now();
    document.getElementById("current-ticket").textContent = `現在計測中: ${nextNumber}番`;
    document.getElementById("elapsed-time").textContent = "00:00";
    runTimer();
    document.getElementById("message").textContent =
      `${finishedTicket}番を${elapsedMinutes}分で保存。${nextNumber}番の計測を開始しました。`;
    loadTimeData();
  } catch(err) {
    // 保存・番号変更の途中で失敗した場合でも、再試行できるよう状態を初期化。
    measuringTicket = null;
    timerStartTime = null;
    document.getElementById("current-ticket").textContent = "現在計測中: -";
    document.getElementById("elapsed-time").textContent = "00:00";
    document.getElementById("message").textContent = "保存または番号変更に失敗しました。";
    console.error(err);
  }
}

loadTimeData();
</script>
</body>
</html>
